# ==============================================================================
# Node-Local Mosquitto Configuration
# Target: Recycled Android Phone (Field Sensor Node)
# Path: /data/data/com.termux/files/home/station/config/mosquitto_node.conf
# ==============================================================================

# 1. Network & Security Binding
# Listen on 0.0.0.0 so neighbor field nodes can replicate in the P2P Mesh
listener 1883 0.0.0.0

# Allow anonymous access over the local agricultural mesh network
allow_anonymous true

# 2. Memory & Storage Preservation (Crucial for degraded eMMC flash memory)
# Disable Mosquitto disk persistence. The Python ingestion engine uses SQLite
# with WAL mode for reliable Store-and-Forward. Double-persisting wears flash.
persistence false

# Keep queue tight to prevent Out-Of-Memory (OOM) killer invocations on low-RAM devices
max_queued_messages 1000
max_queued_bytes 10485760

# 3. CPU & Wake-up Optimization
# Disable internal $SYS topic publishing intervals (default is 10s).
# Periodic $SYS messages force CPU context switches and prevent deep sleep states.
sys_interval 0

# Lower socket overhead
set_tcp_nodelay true

# 4. Logging & Diagnostics
# Log only critical errors to prevent storage degradation and log file inflation.
log_dest file /data/data/com.termux/files/home/station/logs/mosquitto.log
log_type error
log_type warning
connection_messages false
