# ==============================================================================
# Central Node Mosquitto Configuration
# Target: Central Android Station / Master Broker (LAN / Hotspot Gateway)
# Path: /data/data/com.termux/files/home/station/config/mosquitto_central.conf
# ==============================================================================

# 1. Network Listener
# Listens on all interfaces across the local field Wi-Fi network (AP / Hotspot)
listener 1883 0.0.0.0

# In an isolated agricultural Wi-Fi AP, anonymous can be allowed, or set to false
# with a password_file if field security requires sensor node credentials.
allow_anonymous true

# Maximum concurrent client connections (accommodates all field nodes)
max_connections 100

# 2. Persistence (Store & Forward Buffer for Cloud Outages)
# Central node retains incoming telemetric batches while cellular/satellite is offline.
persistence true
persistence_location /data/data/com.termux/files/home/station/central_data/
persistence_file mosquitto.db

# Autosave intervals: commit in-memory queue to disk every 300 seconds (5 min)
# rather than on every single change, protecting phone flash storage from thrashing.
autosave_interval 300
autosave_on_changes false

# 3. Resource & Queue Limits
max_queued_messages 50000
max_inflight_messages 20
max_packet_size 1048576

# Keepalive and timing adjustments
sys_interval 60
set_tcp_nodelay true

# 4. Logging & Diagnostics
log_dest file /data/data/com.termux/files/home/station/logs/mosquitto_central.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
